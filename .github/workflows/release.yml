# Packages the addon and uploads it to CurseForge whenever a tag is pushed.
# A GitHub release with the same zip is created too.
#
# One-time setup:
#   1. ClickLegend.toc: put your CurseForge project ID on the X-Curse-Project-ID line.
#   2. GitHub repo > Settings > Secrets and variables > Actions: add a secret
#      named CF_API_TOKEN holding a CurseForge API token.
#
# To release: git tag -a 1.6.0 -m "1.6.0" && git push origin 1.6.0
name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write      # lets the packager create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history, so the tag is visible to the packager

      - uses: BigWigsMods/packager@v2
        env:
          # The packager's README and wiki name these differently, so both
          # spellings are set from the same secret.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
